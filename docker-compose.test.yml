services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memgauge
      POSTGRES_USER: memgauge
      POSTGRES_PASSWORD: memgauge
    ports:
      - "127.0.0.1:25432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memgauge -d memgauge"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/memgauge-dev
    ports:
      - "127.0.0.1:27474:7474"
      - "127.0.0.1:27687:7687"
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p memgauge-dev 'RETURN 1'",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
