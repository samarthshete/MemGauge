name: MemGauge CI

on:
  push:
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: memgauge
          POSTGRES_USER: memgauge
          POSTGRES_PASSWORD: memgauge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memgauge -d memgauge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/memgauge-dev
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p memgauge-dev 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_DSN: postgresql+asyncpg://memgauge:memgauge@localhost:5432/memgauge
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memgauge-dev
      REDIS_URL: redis://localhost:6379/0
      # Force the deterministic offline hash embeddings so the gate is reproducible.
      EMBEDDING_MODEL: __offline-ci-model__

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database schema
        env:
          PGPASSWORD: memgauge
        run: psql -h localhost -p 5432 -U memgauge -d memgauge -v ON_ERROR_STOP=1 -f app/db/init.sql

      - name: Run unit tests (no services)
        run: make test-unit PYTHON=python

      - name: Run evaluation regression gate
        run: python scripts/run_eval_ci.py --dataset all

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memgauge-eval-report
          path: report.md
          if-no-files-found: warn
