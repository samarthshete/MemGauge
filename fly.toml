# Fly.io config for the MemGauge API — see DEPLOY.md for the full runbook.
# Non-secret config only. All credentials (POSTGRES_DSN, NEO4J_*, REDIS_URL,
# MEMGAUGE_API_TOKEN, ...) are injected via `fly secrets set`, never here.
app = "memgauge"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # The public demo runs the secret-free deterministic backend by policy
  # (PROJECT.md ADR-1); the mem0 backend is local-only.
  MEMGAUGE_BACKEND = "mock"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # /healthz is green only when Postgres + Neo4j + Redis are all reachable,
  # so provision the managed services and set secrets BEFORE the first deploy.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
